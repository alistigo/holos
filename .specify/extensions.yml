installed:
- companion
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: companion
    command: speckit.companion.after-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-specify?
    description: Record the specify start and finish
    condition: null
  after_plan:
  - extension: companion
    command: speckit.companion.after-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-plan?
    description: Record the plan finish
    condition: null
  after_tasks:
  - extension: companion
    command: speckit.companion.after-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-tasks?
    description: Record the tasks finish
    condition: null
  after_implement:
  - extension: companion
    command: speckit.companion.after-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-implement?
    description: Sync implement progress from tasks.md
    condition: null
  before_converge:
  - extension: companion
    command: speckit.companion.before-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-converge?
    description: Record the converge start
    condition: null
  after_converge:
  - extension: companion
    command: speckit.companion.after-converge
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.after-converge?
    description: Record the converge finish
    condition: null
  before_specify:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Save the specify start time until its folder exists
    condition: null
  before_plan:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the plan start
    condition: null
  before_tasks:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the tasks start
    condition: null
  before_implement:
  - extension: companion
    command: speckit.companion.before-step
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.before-step?
    description: Record the implement start
    condition: null

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least-privilege default; deploy job overrides with pages:write + id-token:write.
permissions:
  contents: read

# Never cancel an in-flight deployment — a partial deploy is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # On workflow_run: only proceed when CI passed.
    # On workflow_dispatch: always proceed (manual re-deploy).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      STORYBOOK_BASE_PATH: /storybook/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run fires on the default branch's workflow file, but we
          # want the commit that triggered CI — use head_sha for that.
          # workflow_dispatch sets github.sha to the branch HEAD, which is correct.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install mise + repo tool versions
        uses: jdx/mise-action@v2
        with:
          experimental: true
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployed apps and website
        run: pnpm exec nx run holos:build:deploy

      - name: Assemble _site
        run: bash scripts/assemble-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
